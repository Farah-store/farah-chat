name: Build FARAH CHAT APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create Package File
        run: |
          zip -r farah-chat-source.zip . -x "*.git*"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: farah-chat-build
          path: farah-chat-source.zip
